<!DOCTYPE html>
<html lang="id">
<head>

    <!-- Meta Tags -->

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Title & Favicon -->

    <title>Laris Manis - Pesanan</title>
    <link rel="icon" href="../assets/images/icon.png" type="image/png">

    <!-- Fonts & Icons -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- CSS -->

    <link rel="stylesheet" href="../css/order.css">

</head>
<body>

    <!-- Navbar -->

    <nav class="navbar">

        <div class="logo">
            <img src="../assets/images/icon.png" alt="Logo">

            <h1>Laris Manis</h1>
        </div>

        <ul class="nav-links">
            <li><a href="../index.html">Beranda</a></li>
            <li><a href="../menu/index.html">Menu</a></li>
            <li><a class="active" href="../order/index.html">Pesanan</a></li>
        </ul>

    </nav>

    <!-- Contact Bar -->

    <div class="contactbar">

        <div class="contactbar-left">
            <span>
                <i class="fa-solid fa-brands fa-whatsapp"></i>
                (+62) 857-1912-2564
            </span>

            <span>
                <i class="fa-solid fa-envelope"></i>
                laris.manis.endolita@gmail.com
            </span>
        </div>

        <div class="contactbar-right">
            <a href="https://www.instagram.com/deslialea_22/">
                <i class="fa-solid fa-brands fa-instagram"></i>
            </a>
            <a href="https://www.tiktok.com/@larismanis__22">
                <i class="fa-solid fa-brands fa-tiktok"></i>
            </a>
        </div>

    </div>

    <!-- Order Container -->

    <div class="order-container">

        <!-- Orders -->

        <div class="section-header">
            <h2><i class="fa-solid fa-shopping-cart"></i> Pesanan Saya</h2>
            <div class="scroll-buttons">
                <button class="scroll-btn" id="scrollOrderLeftBtn"><i class="fas fa-chevron-left"></i></button>
                <button class="scroll-btn" id="scrollOrderRightBtn"><i class="fas fa-chevron-right"></i></button>
            </div>
        </div>

        <div class="scroll-wrapper" id="orderWrapper"></div>

        <!-- Price Total -->

        <div class="section-header">
            <h2><i class="fa-solid fa-tag"></i> Total Harga</h2>
        </div>

        <div id="totalPrice"></div>
        <br>
        <br>

        <!-- Payment Methods -->

        <div class="section-header">
            <h2><i class="fa-solid fa-credit-card"></i> Metode Pembayaran</h2>
        </div>

        <div id="paymentMethods">

            <div class="payment-option">

                <input
                    type="radio"
                    class="payment-btn"
                    name="paymentMethod"
                    id="cashPayment"
                    value="cash"
                    checked
                >

                <label for="cashPayment"> <i class="fa-solid fa-money-bill-wave"></i> Tunai</label>

            </div>

            <div class="payment-option">

                <input
                    type="radio"
                    class="payment-btn"
                    name="paymentMethod"
                    id="qrisPayment"
                    value="qris"
                >

                <label for="qrisPayment"><i class="fa-solid fa-qrcode"></i> QRIS</label>

            </div>

            <div class="payment-option">

                <input
                    type="radio"
                    class="payment-btn"
                    name="paymentMethod"
                    id="transferPayment"
                    value="transfer"
                >

                <label for="transferPayment"><i class="fa-solid fa-credit-card"></i> Transfer</label>

            </div>

        </div>
        <br>
        <br>

        <!-- Delivery Infos -->

        <div class="section-header">
            <h2><i class="fa-solid fa-truck"></i> Pengantaran Pesanan</h2>
        </div>

        <div class="delivery-infos">

            <label for="customerName"><i class="fa-solid fa-user"></i> Nama Penerima</label>

            <input
                type="text"
                id="customerName"
                placeholder="Contoh: Bu Siti"
                required
            >
            <br>

            <label for="customerPhone"><i class="fa-solid fa-phone"></i> Nomor Telpon Penerima</label>

            <input
                type="tel"
                id="customerPhone"
                pattern="[0-9]{4}-[0-9]{4}-[0-9]{4}" 
                placeholder="Contoh: 0812-3456-7890"
                required
            >
            <br>

            <label for="deliveryTime"><i class="fa-solid fa-clock"></i> Waktu Pengantaran</label>

            <input
                type="datetime-local"
                id="deliveryTime"
                required
            >
            <br>

            <label for="customerAddress"><i class="fa-solid fa-map-marker-alt"></i> Alamat Lengkap</label>

            <textarea 
                id="customerAddress" 
                rows="3" 
                placeholder="Contoh: Jl. Anggrek No. 12, RT 03/RW 04, Kec. Meruya (Pagar warna hitam)"
                required
            ></textarea>
            
        </div>

        <button id="placeOrderButton" onclick="placeOrder()"><i class="fa-solid fa-brands fa-whatsapp"></i> Pesan</button>

    </div>

    <!-- Scripts -->
     
    <script src="../js/horizontalScroll.js"></script>
    <script src="../js/orderPage.js"></script>
    <script src="../js/placeOrder.js"></script>

    <script>
        setupHorizontalScroll("orderWrapper", "scrollOrderLeftBtn", "scrollOrderRightBtn");
    </script>

</body>
</html>
